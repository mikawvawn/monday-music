server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content refreshes weekly — don't let browsers serve a stale page.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
